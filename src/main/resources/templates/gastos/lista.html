<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mis gastos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-4">

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h3 mb-0">Mis gastos</h1>
        <a th:href="@{/gastos/nuevo}" class="btn btn-primary">+ Nuevo gasto</a>
    </div>

    <div th:if="${mensaje}" class="alert alert-success" th:text="${mensaje}"></div>

    <div class="card shadow-sm">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                <tr>
                    <th>Fecha</th>
                    <th>Descripción</th>
                    <th>Categoría</th>
                    <th class="text-end">Monto</th>
                    <th class="text-end">Acciones</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="g : ${pagina.content}">
                    <td th:text="${g.fecha}"></td>
                    <td th:text="${g.descripcion}"></td>
                    <td th:text="${g.categoria != null ? g.categoria.nombre : '-'}"></td>
                    <td class="text-end"
                        th:text="'$ ' + ${#numbers.formatDecimal(g.monto, 1, 'POINT', 2, 'COMMA')}"></td>
                    <td class="text-end">
                        <a th:href="@{/gastos/{id}/editar(id=${g.id})}"
                           class="btn btn-sm btn-outline-secondary">Editar</a>
                        <form th:action="@{/gastos/{id}/eliminar(id=${g.id})}" method="post"
                              class="d-inline" onsubmit="return confirm('¿Eliminar este gasto?')">
                            <button type="submit" class="btn btn-sm btn-outline-danger">Eliminar</button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${pagina.empty}">
                    <td colspan="5" class="text-center text-muted py-4">Aún no tienes gastos registrados</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <nav th:if="${pagina.totalPages > 1}" class="mt-3">
        <ul class="pagination justify-content-center">
            <li class="page-item" th:classappend="${pagina.first} ? 'disabled'">
                <a class="page-link" th:href="@{/gastos(page=${pagina.number - 1})}">Anterior</a>
            </li>
            <li class="page-item disabled">
                <span class="page-link" th:text="${pagina.number + 1} + ' de ' + ${pagina.totalPages}"></span>
            </li>
            <li class="page-item" th:classappend="${pagina.last} ? 'disabled'">
                <a class="page-link" th:href="@{/gastos(page=${pagina.number + 1})}">Siguiente</a>
            </li>
        </ul>
    </nav>
</div>
</body>
</html>
