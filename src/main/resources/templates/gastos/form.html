<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Gasto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-4" style="max-width: 600px;">

    <h1 class="h3 mb-3" th:text="${gastoForm.id == null} ? 'Nuevo gasto' : 'Editar gasto'"></h1>

    <form th:action="@{/gastos/guardar}" th:object="${gastoForm}" method="post"
          class="card card-body shadow-sm">

        <input type="hidden" th:field="*{id}">

        <div class="mb-3">
            <label class="form-label">Descripción</label>
            <input type="text" th:field="*{descripcion}" class="form-control"
                   th:classappend="${#fields.hasErrors('descripcion')} ? 'is-invalid'">
            <div class="invalid-feedback" th:errors="*{descripcion}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">Monto</label>
            <input type="number" step="0.01" th:field="*{monto}" class="form-control"
                   th:classappend="${#fields.hasErrors('monto')} ? 'is-invalid'">
            <div class="invalid-feedback" th:errors="*{monto}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">Fecha</label>
            <input type="date" th:field="*{fecha}" class="form-control"
                   th:classappend="${#fields.hasErrors('fecha')} ? 'is-invalid'">
            <div class="invalid-feedback" th:errors="*{fecha}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">Categoría</label>
            <select th:field="*{categoriaId}" class="form-select"
                    th:classappend="${#fields.hasErrors('categoriaId')} ? 'is-invalid'">
                <option value="">-- Selecciona --</option>
                <option th:each="c : ${categorias}" th:value="${c.id}" th:text="${c.nombre}"></option>
            </select>
            <div class="invalid-feedback" th:errors="*{categoriaId}"></div>
        </div>

        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">Guardar</button>
            <a th:href="@{/gastos}" class="btn btn-outline-secondary">Cancelar</a>
        </div>
    </form>
</div>
</body>
</html>
