<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-4">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h1 class="h3 mb-0">Resumen</h1>
            <span class="text-muted text-capitalize" th:text="${mes}"></span>
        </div>
        <div class="d-flex gap-2">
            <a th:href="@{/gastos}" class="btn btn-outline-primary">Ver todos los gastos</a>
            <a th:href="@{/gastos/nuevo}" class="btn btn-primary">+ Nuevo gasto</a>
            <form th:action="@{/logout}" method="post">
                <button type="submit" class="btn btn-outline-secondary">Cerrar sesión</button>
            </form>
        </div>
    </div>

    <!-- Tarjetas con los totales -->
    <div class="row g-3 mb-4">
        <div class="col-md-4">
            <div class="card shadow-sm h-100"><div class="card-body">
                <div class="text-muted small">Total del mes</div>
                <div class="h3 mb-0"
                     th:text="'$ ' + ${#numbers.formatDecimal(resumen.total, 1, 'POINT', 2, 'COMMA')}"></div>
            </div></div>
        </div>
        <div class="col-md-4">
            <div class="card shadow-sm h-100"><div class="card-body">
                <div class="text-muted small">Número de gastos</div>
                <div class="h3 mb-0" th:text="${resumen.cantidad}"></div>
            </div></div>
        </div>
        <div class="col-md-4">
            <div class="card shadow-sm h-100"><div class="card-body">
                <div class="text-muted small">Promedio por gasto</div>
                <div class="h3 mb-0"
                     th:text="'$ ' + ${#numbers.formatDecimal(resumen.promedio, 1, 'POINT', 2, 'COMMA')}"></div>
            </div></div>
        </div>
    </div>

    <div class="row g-3">
        <!-- Gráfico -->
        <div class="col-lg-6">
            <div class="card shadow-sm h-100"><div class="card-body">
                <h2 class="h6">Gasto por categoría</h2>
                <p th:if="${resumen.cantidad == 0}" class="text-muted mb-0">
                    Aún no hay gastos este mes.
                </p>
                <div th:unless="${resumen.cantidad == 0}" style="max-width: 320px; margin: 0 auto;">
                    <canvas id="graficoCategorias"></canvas>
                </div>
            </div></div>
        </div>

        <!-- Últimos gastos -->
        <div class="col-lg-6">
            <div class="card shadow-sm h-100"><div class="card-body">
                <h2 class="h6">Últimos gastos</h2>
                <p th:if="${#lists.isEmpty(ultimos)}" class="text-muted mb-0">Sin gastos registrados.</p>
                <ul class="list-group list-group-flush" th:unless="${#lists.isEmpty(ultimos)}">
                    <li class="list-group-item d-flex justify-content-between px-0" th:each="g : ${ultimos}">
                        <span>
                            <span th:text="${g.descripcion}"></span><br>
                            <small class="text-muted"
                                   th:text="${g.fecha} + ' · ' + (${g.categoria != null} ? ${g.categoria.nombre} : '-')"></small>
                        </span>
                        <span th:text="'$ ' + ${#numbers.formatDecimal(g.monto, 1, 'POINT', 2, 'COMMA')}"></span>
                    </li>
                </ul>
            </div></div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script th:inline="javascript">
    // Thymeleaf convierte las listas de Java a JSON válido dentro del script
    const etiquetas = /*[[${resumen.etiquetas}]]*/ [];
    const valores = /*[[${resumen.valores}]]*/ [];

    const canvas = document.getElementById('graficoCategorias');
    if (canvas && etiquetas.length > 0) {
        new Chart(canvas, {
            type: 'doughnut',
            data: {
                labels: etiquetas,
                datasets: [{ data: valores }]
            },
            options: { plugins: { legend: { position: 'bottom' } } }
        });
    }
</script>
</body>
</html>
