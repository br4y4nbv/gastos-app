<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Crear cuenta</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5" style="max-width: 420px;">
    <h1 class="h3 mb-3 text-center">Crear cuenta</h1>

    <form th:action="@{/registro}" th:object="${registroForm}" method="post" class="card card-body shadow-sm">

        <div class="mb-3">
            <label class="form-label">Nombre</label>
            <input type="text" th:field="*{nombre}" class="form-control"
                   th:classappend="${#fields.hasErrors('nombre')} ? 'is-invalid'">
            <div class="invalid-feedback" th:errors="*{nombre}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">Correo</label>
            <input type="email" th:field="*{email}" class="form-control"
                   th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'">
            <div class="invalid-feedback" th:errors="*{email}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">Contraseña</label>
            <input type="password" th:field="*{password}" class="form-control"
                   th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'">
            <div class="invalid-feedback" th:errors="*{password}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">Confirmar contraseña</label>
            <input type="password" th:field="*{confirmarPassword}" class="form-control"
                   th:classappend="${#fields.hasErrors('confirmarPassword')} ? 'is-invalid'">
            <div class="invalid-feedback" th:errors="*{confirmarPassword}"></div>
        </div>

        <button type="submit" class="btn btn-primary w-100">Registrarme</button>
    </form>

    <p class="text-center mt-3">¿Ya tienes cuenta? <a th:href="@{/login}">Inicia sesión</a></p>
</div>
</body>
</html>
